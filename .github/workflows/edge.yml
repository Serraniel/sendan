# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Unversioned image built from main. See docs/workflows/edge.md
name: Edge image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  edge:
    name: Build and push :edge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A registry rejects any uppercase in a repository name, and
      # github.repository preserves the case of the account that owns it. This
      # replaces the workflow-level IMAGE with a lowercase one, so every
      # ${{ env.IMAGE }} below resolves to something a registry accepts.
      - name: Take the image name down to lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No Dockerfile yet - skipping."
          fi

      - if: steps.guard.outputs.present == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: steps.guard.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately unversioned and unsigned. This is a moving pointer at the
      # tip of main for people who want to test unreleased work; it carries no
      # stability claim and must never be presented as a release.
      - if: steps.guard.outputs.present == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Sendan (edge)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
