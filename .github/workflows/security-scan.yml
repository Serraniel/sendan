#
# Known-vulnerability scanning. See docs/workflows/security-scan.md
name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The Go release line every job builds against.
#
# A line rather than an exact patch, deliberately. setup-go resolves this to the
# newest patch release, so a standard library fix arrives without anyone editing
# a file. Pinning the patch was tried and reverted in #117: it made continuous
# integration build against a version with known vulnerabilities, which
# govulncheck reported within minutes.
#
# The minimum the module requires is the go directive in go.mod, which is a
# different question and a different value.
env:
  GO_VERSION: "1.25"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # govulncheck reports only vulnerabilities actually reachable from this
      # code, so its findings are high signal and worth failing on.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    name: npm audit (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No web/package.json yet - skipping."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run npm audit
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: npm audit --audit-level=high
