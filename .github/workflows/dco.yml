# SPDX-License-Identifier: AGPL-3.0-or-later
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-signoff:
    name: Check Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          for sha in $commits; do
            # Merge commits are generated by GitHub and cannot be signed off.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            author="$(git log -1 --format='%an <%ae>' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"

            if git log -1 --format='%B' "$sha" \
                 | grep -qiF "Signed-off-by: ${author}"; then
              echo "ok    ${sha:0:8}  ${subject}"
            else
              echo "FAIL  ${sha:0:8}  ${subject}"
              echo "      expected: Signed-off-by: ${author}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          ---
          One or more commits are missing a Signed-off-by line matching their
          author. Sendan requires the Developer Certificate of Origin:

              https://developercertificate.org/

          Fix the most recent commit:
              git commit --amend -s --no-edit

          Fix a whole branch:
              git rebase --signoff main

          Then force-push. See CONTRIBUTING.md for details.
          EOF
            exit 1
          fi

          echo "All commits signed off."
