# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Commit hygiene gate. See docs/workflows/commit-check.md
name: Commit check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          failed=0
          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then echo "No commits to check."; exit 0; fi

          # An automated dependency update signs off under an identity that does
          # not match the one it authors with:
          #
          #   author:        dependabot[bot] <...+dependabot[bot]@users.noreply.github.com>
          #   Signed-off-by: dependabot[bot] <support@github.com>
          #
          # An exact match can therefore never succeed, and no rewrite is
          # available because nobody holds the bot's key. Such a pull request
          # must still carry a sign-off; it need not match.
          #
          # The exemption is decided by the pull request's author, which GitHub
          # authenticates. The commit author field is chosen by whoever made the
          # commit, so keying on it would let anyone claim to be a bot.
          case "$PR_AUTHOR" in
            *'[bot]')
              bot_pr=1
              echo "Pull request opened by ${PR_AUTHOR}: a sign-off is required, but need not match the author."
              echo ""
              ;;
            *) bot_pr=0 ;;
          esac

          for sha in $commits; do
            # Merge commits are generated by GitHub and cannot be signed off.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"

            if [ "$bot_pr" -eq 1 ]; then
              if git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
                echo "ok    ${sha:0:8}  ${subject}"
              else
                echo "FAIL  ${sha:0:8}  ${subject}"
                echo "      a bot pull request still requires a Signed-off-by line"
                failed=1
              fi
              continue
            fi

            if git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: ${author}"; then
              echo "ok    ${sha:0:8}  ${subject}"
            else
              echo "FAIL  ${sha:0:8}  ${subject}"
              echo "      expected: Signed-off-by: ${author}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Commits are missing a Signed-off-by line matching their author."
            echo "Sendan requires the Developer Certificate of Origin."
            echo ""
            echo "  Fix the last commit:  git commit --amend -s --no-edit"
            echo "  Fix a whole branch:   git rebase --signoff main"
            echo ""
            echo "See CONTRIBUTING.md and https://developercertificate.org/"
            exit 1
          fi
          echo "All commits signed off."

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify every commit subject is a Conventional Commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Release tooling derives the version and changelog from these
          # subjects, so a malformed one silently corrupts the release notes.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,/-]+\))?!?: .+'
          failed=0
          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then echo "No commits to check."; exit 0; fi

          for sha in $commits; do
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            subject="$(git log -1 --format='%s' "$sha")"
            if printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "ok    ${sha:0:8}  ${subject}"
            else
              echo "FAIL  ${sha:0:8}  ${subject}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Commit subjects must follow Conventional Commits:"
            echo ""
            echo "  <type>[(scope)][!]: <description>"
            echo ""
            echo "  types: feat fix docs style refactor perf test build ci chore revert"
            echo "  '!' marks a breaking change, e.g. feat(crypto)!: change key schedule"
            echo ""
            echo "Rewrite with:  git rebase -i --signoff main"
            echo "See CONTRIBUTING.md and https://www.conventionalcommits.org/"
            exit 1
          fi
          echo "All commit subjects valid."
