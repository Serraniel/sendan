# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Browser-driven flows. Advisory, not a merge gate. See docs/workflows/e2e-test.md
name: E2E test

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: guard
        run: |
          if [ -f web/playwright.config.ts ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No Playwright config yet - skipping."
          fi

      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browsers
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      # Retries are configured in playwright.config.ts (2 on CI) so that only
      # the failing test reruns, not the whole suite. Tests that pass on retry
      # are reported as "flaky" rather than silently green.
      - name: Run flows
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: npx playwright test

      - name: Summarise flaky tests
        if: always() && steps.guard.outputs.present == 'true'
        working-directory: web
        run: |
          set -uo pipefail
          report=playwright-report/results.json
          [ -f "$report" ] || exit 0
          flaky=$(node -e "
            const r=require('./playwright-report/results.json');
            const walk=s=>(s.suites||[]).flatMap(walk).concat((s.specs||[]).flatMap(sp=>sp.tests||[]));
            const t=(r.suites||[]).flatMap(walk);
            console.log(t.filter(x=>x.status==='flaky').length);
          " 2>/dev/null || echo 0)
          echo "Flaky tests this run: $flaky" >> "$GITHUB_STEP_SUMMARY"
          if [ "$flaky" -gt 0 ]; then
            echo "::warning::$flaky test(s) passed only on retry - investigate before they start failing outright"
          fi

      - name: Upload report
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
