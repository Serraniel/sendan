# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes signed, versioned artefacts. See docs/workflows/release.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The CLI is the project's trust anchor, so reproducibility is verified at the
  # moment it matters rather than assumed. Two independent builds of the same
  # source must be byte-identical.
  verify-reproducible:
    name: Verify reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Every target, through the same script a user runs to reproduce a
      # release. Checking one target would leave five unverified, and checking
      # them with different commands would verify something nobody can repeat.
      - name: Build twice and compare
        run: |
          set -euo pipefail
          export SENDAN_VERSION="${GITHUB_REF_NAME:-dev}"
          export SENDAN_COMMIT="${GITHUB_SHA:-unknown}"

          ./scripts/release-build.sh /tmp/dist-a >/dev/null
          go clean -cache
          ./scripts/release-build.sh /tmp/dist-b >/dev/null

          if ! diff -u /tmp/dist-a/SHA256SUMS /tmp/dist-b/SHA256SUMS; then
            echo "::error::Build is not reproducible - users cannot verify the released binary"
            exit 1
          fi
          echo "Reproducible across $(wc -l < /tmp/dist-a/SHA256SUMS) targets:"
          cat /tmp/dist-a/SHA256SUMS

  # The command line client's binaries, built by the same script as above and
  # published with their checksums. Deliberately not waiting on the release tool
  # in the job below: this is the trust anchor, and its build path is kept
  # simple enough that somebody can repeat it by hand.
  cli-binaries:
    name: Publish the command line client
    runs-on: ubuntu-latest
    needs: [verify-reproducible]
    permissions:
      contents: write
      # For keyless signing below: Fulcio issues a short-lived certificate
      # against this token, so what the signature attests to is that this
      # workflow, in this repository, at this tag produced the file.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build every target
        run: |
          set -euo pipefail
          export SENDAN_VERSION="${GITHUB_REF_NAME:-dev}"
          export SENDAN_COMMIT="${GITHUB_SHA:-unknown}"
          ./scripts/release-build.sh dist

      # The statement `sendan verify` compares an instance against. Published
      # here rather than with the container image, because a verifier that has
      # to wait for the release tooling is a verifier nobody can use - and it is
      # the same release the binaries come from, which is what makes the version
      # in it mean anything.
      - name: State what this release's client hashes to
        run: |
          set -euo pipefail
          (cd web && npm ci && npm run build)
          SENDAN_VERSION="${GITHUB_REF_NAME:-dev}" SENDAN_COMMIT="${GITHUB_SHA:-unknown}" \
            ./scripts/asset-manifest.sh dist/manifest.json
      # An unsigned manifest is only as trustworthy as the page it came from,
      # and that page is the obvious thing to replace if the goal is to make a
      # backdoored instance verify clean. Signed keylessly: there is no key to
      # steal, and the certificate binds the signature to this workflow at this
      # tag, so forging one means running this workflow rather than obtaining a
      # secret. Every issuance is public in the transparency log.
      #
      # SHA256SUMS is signed by the same step because docs/cli.md asks people to
      # check binaries against it; signing the manifest and leaving the checksums
      # unsigned would just move the unsigned link in the chain.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the manifest and the checksums
        run: |
          set -euo pipefail
          for file in manifest.json SHA256SUMS; do
            cosign sign-blob --yes \
              --bundle "dist/${file}.sigstore.json" \
              "dist/${file}"
          done

      # The post-quantum signature is not made here either, and for the same
      # reason as the Ed25519 one: its key is held offline. Sigstore signs with
      # ECDSA, so the signature this job does make rests on a primitive Shor's
      # algorithm breaks - which is what the other two are for.

      # The two signatures `sendan verify` checks. Made here, from keys held as
      # repository secrets, because releases are tagged automatically and a
      # signature waiting on a person is a release that sits unverifiable until
      # somebody is free.
      #
      # What that costs is stated rather than glossed: a key this job can reach
      # is a key an attacker who reaches this job can use, so none of these
      # signatures survives a compromise of this repository. What survives is
      # discovery - the Sigstore signature above is recorded in a public
      # transparency log against the workflow that made it, and the build is
      # reproducible from source. SECURITY.md says so in those words.
      #
      # Skipped, not failed, when the secrets are absent: a release that stops
      # because a key has not been generated yet is worse than one that is
      # honestly unsigned, and `sendan verify` reports the difference.
      - name: Sign the manifest with the release keys
        env:
          MINISIGN_KEY: ${{ secrets.SENDAN_MINISIGN_KEY }}
          PQ_KEY: ${{ secrets.SENDAN_PQ_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${MINISIGN_KEY}" ] || [ -z "${PQ_KEY}" ]; then
            echo "::warning::No release signing keys are configured, so this release is unsigned."
            {
              echo "### This release is not signed"
              echo
              echo "SENDAN_MINISIGN_KEY and SENDAN_PQ_KEY are not set, so"
              echo "\`sendan verify\` will report this release as unsigned."
              echo "docs/workflows/release.md says how to generate them."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Written to the runner's own temporary directory and removed after,
          # rather than into the checkout, where a later step could publish one.
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "${MINISIGN_KEY}" > "$keydir/minisign.key"
          printf '%s' "${PQ_KEY}" > "$keydir/release.pqkey"

          # A Go implementation, so no apt install and no interactive prompt.
          # The key is stored unencrypted (minisign -G -W): a passphrase beside
          # the key in the same secret store protects nothing, and a prompt is
          # the manual step this whole design exists to remove.
          go install aead.dev/minisign/cmd/minisign@latest

          minisign -S \
            -s "$keydir/minisign.key" \
            -m dist/manifest.json \
            -t "sendan ${GITHUB_REF_NAME} client asset manifest"

          go run ./tools/pq-sign sign "$keydir/release.pqkey" dist/manifest.json

          ls -l dist/manifest.json.minisig dist/manifest.json.slhdsa

      - name: Record the toolchain a reproduction needs
        run: |
          {
            echo "Built with: $(go version)"
            echo
            echo "To reproduce:"
            echo
            echo '```sh'
            echo "git checkout ${GITHUB_REF_NAME:-HEAD}"
            echo "SENDAN_VERSION=${GITHUB_REF_NAME:-dev} SENDAN_COMMIT=${GITHUB_SHA:-unknown} \\"
            echo "  ./scripts/release-build.sh"
            echo "sha256sum -c dist/SHA256SUMS"
            echo '```'
          } > dist/REPRODUCING.md
          cat dist/REPRODUCING.md
      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [verify-reproducible]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # A registry rejects any uppercase in a repository name, and
      # github.repository preserves the case of the account that owns it. This
      # replaces the workflow-level IMAGE with a lowercase one, so every
      # ${{ env.IMAGE }} below resolves to something a registry accepts.
      - name: Take the image name down to lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging scheme:
      #   post-1.0   :1.4.2  :1.4  :1  :latest  :sha-abc1234
      #   pre-1.0    :0.1.0  :0.1        :latest  :sha-abc1234
      # The bare major tag is suppressed below v1 because under SemVer a 0.x
      # minor bump is permitted to break compatibility, so a moving :0 tag
      # would silently break operators.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Sendan
            org.opencontainers.image.description=Self-hosted, end-to-end encrypted file sharing
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Without these the image reports itself as "dev", and an instance
          # that cannot say which release it is cannot be checked against one -
          # `sendan verify` reads /api/source to decide which published manifest
          # to compare against.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
