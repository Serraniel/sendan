# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes signed, versioned artefacts. See docs/workflows/release.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The CLI is the project's trust anchor, so reproducibility is verified at the
  # moment it matters rather than assumed. Two independent builds of the same
  # source must be byte-identical.
  verify-reproducible:
    name: Verify reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Every target, through the same script a user runs to reproduce a
      # release. Checking one target would leave five unverified, and checking
      # them with different commands would verify something nobody can repeat.
      - name: Build twice and compare
        run: |
          set -euo pipefail
          export SENDAN_VERSION="${GITHUB_REF_NAME:-dev}"
          export SENDAN_COMMIT="${GITHUB_SHA:-unknown}"

          ./scripts/release-build.sh /tmp/dist-a >/dev/null
          go clean -cache
          ./scripts/release-build.sh /tmp/dist-b >/dev/null

          if ! diff -u /tmp/dist-a/SHA256SUMS /tmp/dist-b/SHA256SUMS; then
            echo "::error::Build is not reproducible - users cannot verify the released binary"
            exit 1
          fi
          echo "Reproducible across $(wc -l < /tmp/dist-a/SHA256SUMS) targets:"
          cat /tmp/dist-a/SHA256SUMS

  # The command line client's binaries, built by the same script as above and
  # published with their checksums. Deliberately not waiting on the release tool
  # in the job below: this is the trust anchor, and its build path is kept
  # simple enough that somebody can repeat it by hand.
  cli-binaries:
    name: Publish the command line client
    runs-on: ubuntu-latest
    needs: [verify-reproducible]
    permissions:
      contents: write
      # For keyless signing below: Fulcio issues a short-lived certificate
      # against this token, so what the signature attests to is that this
      # workflow, in this repository, at this tag produced the file.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build every target
        run: |
          set -euo pipefail
          export SENDAN_VERSION="${GITHUB_REF_NAME:-dev}"
          export SENDAN_COMMIT="${GITHUB_SHA:-unknown}"
          ./scripts/release-build.sh dist

      # The statement `sendan verify` compares an instance against. Published
      # here rather than with the container image, because a verifier that has
      # to wait for the release tooling is a verifier nobody can use - and it is
      # the same release the binaries come from, which is what makes the version
      # in it mean anything.
      - name: State what this release's client hashes to
        run: |
          set -euo pipefail
          (cd web && npm ci && npm run build)
          SENDAN_VERSION="${GITHUB_REF_NAME:-dev}" SENDAN_COMMIT="${GITHUB_SHA:-unknown}" \
            ./scripts/asset-manifest.sh dist/manifest.json
      # An unsigned manifest is only as trustworthy as the page it came from,
      # and that page is the obvious thing to replace if the goal is to make a
      # backdoored instance verify clean. Signed keylessly: there is no key to
      # steal, and the certificate binds the signature to this workflow at this
      # tag, so forging one means running this workflow rather than obtaining a
      # secret. Every issuance is public in the transparency log.
      #
      # SHA256SUMS is signed by the same step because docs/cli.md asks people to
      # check binaries against it; signing the manifest and leaving the checksums
      # unsigned would just move the unsigned link in the chain.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the manifest and the checksums
        run: |
          set -euo pipefail
          for file in manifest.json SHA256SUMS; do
            cosign sign-blob --yes \
              --bundle "dist/${file}.sigstore.json" \
              "dist/${file}"
          done

      # TODO(#60): add a post-quantum signature (SPHINCS+ preferred) alongside
      # these. Sigstore signs with ECDSA, so a release signed only this way rests
      # on a primitive Shor's algorithm breaks - and a signature's job is to
      # still mean something years after it was made.

      # The signature `sendan verify` requires cannot be made here. Its key is
      # held offline precisely so that whoever compromises this workflow does not
      # get it, and a key this job could reach would be a key this job could
      # leak. The release is therefore published unsigned by that key, and stays
      # unverifiable until a maintainer signs it - which `sendan verify` reports
      # as an unsigned release rather than as a pass.
      - name: Say what remains to be signed by hand
        run: |
          {
            echo "### This release is not yet verifiable"
            echo
            echo "\`sendan verify\` will report it as unsigned until the release"
            echo "key signs the manifest. On the machine holding that key:"
            echo
            echo '```sh'
            echo "gh release download ${GITHUB_REF_NAME} -p manifest.json"
            echo "minisign -Sm manifest.json -t 'sendan ${GITHUB_REF_NAME} client asset manifest'"
            echo "gh release upload ${GITHUB_REF_NAME} manifest.json.minisig"
            echo '```'
            echo
            echo "Reproduce the build first and confirm the manifest matches;"
            echo "signing what CI produced without checking it signs whatever CI"
            echo "produced. See docs/workflows/release.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the toolchain a reproduction needs
        run: |
          {
            echo "Built with: $(go version)"
            echo
            echo "To reproduce:"
            echo
            echo '```sh'
            echo "git checkout ${GITHUB_REF_NAME:-HEAD}"
            echo "SENDAN_VERSION=${GITHUB_REF_NAME:-dev} SENDAN_COMMIT=${GITHUB_SHA:-unknown} \\"
            echo "  ./scripts/release-build.sh"
            echo "sha256sum -c dist/SHA256SUMS"
            echo '```'
          } > dist/REPRODUCING.md
          cat dist/REPRODUCING.md
      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    needs: [verify-reproducible]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: guard
        run: |
          if [ -f .goreleaser.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No .goreleaser.yaml yet - skipping."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build web client for embedding
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ -f web/package.json ]; then (cd web && npm ci && npm run build); fi
      - if: steps.guard.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # TODO(#60): add a post-quantum signature (SPHINCS+ preferred) alongside
      # the Sigstore signature once tooling supports it. Sigstore is currently
      # ECDSA-based and therefore exposed to Shor's algorithm.
      - if: steps.guard.outputs.present == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [verify-reproducible]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No Dockerfile yet - skipping."
          fi

      - if: steps.guard.outputs.present == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: steps.guard.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging scheme:
      #   post-1.0   :1.4.2  :1.4  :1  :latest  :sha-abc1234
      #   pre-1.0    :0.1.0  :0.1        :latest  :sha-abc1234
      # The bare major tag is suppressed below v1 because under SemVer a 0.x
      # minor bump is permitted to break compatibility, so a moving :0 tag
      # would silently break operators.
      - id: meta
        if: steps.guard.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Sendan
            org.opencontainers.image.description=Self-hosted, end-to-end encrypted file sharing
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        if: steps.guard.outputs.present == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Without these the image reports itself as "dev", and an instance
          # that cannot say which release it is cannot be checked against one -
          # `sendan verify` reads /api/source to decide which published manifest
          # to compare against.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - if: steps.guard.outputs.present == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          upload-artifact: true

      - if: steps.guard.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        if: steps.guard.outputs.present == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
