#
# The primary merge gate. See docs/workflows/test.md
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No go.mod yet - skipping. Remove this guard with the Go scaffold."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: steps.guard.outputs.present == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  test-go:
    name: Unit and integration tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No go.mod yet - skipping. Remove this guard with the Go scaffold."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        if: steps.guard.outputs.present == 'true'
        run: go vet ./...
      - name: go test (race detector, coverage)
        if: steps.guard.outputs.present == 'true'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 7

  test-web:
    name: Unit tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No web/package.json yet - skipping. Remove this guard with the web scaffold."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run check
          npm run test
          npm run build

      # A single external origin in the built output breaks the strict CSP and
      # silently reintroduces a third party into an end-to-end encrypted page.
      - name: Assert no external origins in built output
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          if [ ! -d build ]; then echo "::warning::No build output to audit"; exit 0; fi
          if grep -rInP 'https?://(?!localhost|127\.0\.0\.1)' build --include='*.js' --include='*.css' --include='*.html'; then
            echo "::error::External origin found in built output - this breaks the CSP guarantee"
            exit 1
          fi
          echo "No external origins found."

  test-vectors:
    name: Cross-language crypto vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -d testdata/vectors ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No testdata/vectors yet - skipping. Remove this guard with the crypto core."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This is the check that stops the CLI and the browser disagreeing about
      # what a file means. It must never be made non-blocking.
      - name: Verify Go implementation against shared vectors
        if: steps.guard.outputs.present == 'true'
        run: go test ./internal/crypto/... -run TestVectors -v
      - name: Verify TypeScript implementation against shared vectors
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run test:vectors

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No go.mod yet - skipping. Remove this guard with the Go scaffold."
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build web client, then the binary with assets embedded
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ -f web/package.json ]; then
            (cd web && npm ci && npm run build)
          fi
          go build ./...
