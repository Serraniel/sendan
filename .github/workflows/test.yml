# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The primary merge gate. See docs/workflows/test.md
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  test-go:
    name: Unit and integration tests (Go)
    runs-on: ubuntu-latest

    # The store conformance suite runs against every backend, so PostgreSQL has
    # to be real. Without this the PostgreSQL cases would skip, and a backend
    # whose tests never run is a backend nobody is testing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: sendan
          POSTGRES_DB: sendan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SENDAN_TEST_POSTGRES: postgres://postgres:sendan@127.0.0.1:5432/sendan?sslmode=disable
      SENDAN_TEST_S3: s3://sendan:sendansecret@127.0.0.1:9000/sendan?ssl=false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # MinIO is started here rather than as a service container: services
      # cannot pass a command, and the image needs "server /data".
      - name: Start the object store
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=sendan             -e MINIO_ROOT_PASSWORD=sendansecret             quay.io/minio/minio:latest server /data
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
          chmod +x "$RUNNER_TEMP/mc"
          for _ in $(seq 1 30); do
            "$RUNNER_TEMP/mc" alias set ci http://127.0.0.1:9000 sendan sendansecret >/dev/null 2>&1 && break
            sleep 2
          done
          "$RUNNER_TEMP/mc" mb --ignore-existing ci/sendan

      - name: go vet
        run: go vet ./...
      - name: go test (race detector, coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # A floor per package, ratcheted just below what is achieved, so a change
      # that reduces coverage fails rather than being noticed later. It also
      # rejects a package with no floor and a floor for a package that is gone,
      # which is what stops the file drifting into decoration.
      - name: Enforce coverage floors
        run: ./scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 7

  test-web:
    name: Unit tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run lint
          npm run check
          npm run test:coverage
          npm run build

      # Two failures the policy causes at run time and nothing else reports. A
      # single external origin breaks the strict CSP and silently reintroduces a
      # third party into an end-to-end encrypted page. An inline style is
      # refused outright, and a refused style is not a broken page - it renders
      # correctly in development, which sends no policy, and wrongly everywhere
      # that matters. The policy is the enforcement; this says so at build time
      # rather than in a browser console.
      #
      # It checks for references that cause a load, not for the text of a URL:
      # an earlier version grepped every script for https:// and failed on the
      # documentation links inside Svelte's own error messages.
      - name: Assert the client runs under its own Content-Security-Policy
        run: ./scripts/audit-assets.sh

  test-vectors:
    name: Cross-language crypto vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This is the check that stops the CLI and the browser disagreeing about
      # what a file means. It must never be made non-blocking.
      - name: Verify Go implementation against shared vectors
        run: go test ./internal/crypto/... -run TestVectors -v

      # The vectors must match what was committed. A change to the encoder that
      # also regenerates its own fixture would otherwise pass silently, which
      # would defeat the entire point of a cross-language fixture.
      - name: Assert committed vectors are reproducible
        run: |
          set -euo pipefail
          node testdata/vectors/generate-json-encoding.mjs
          go test ./internal/crypto/ -run TestVectors -update-vectors
          # git status rather than git diff, so a newly generated but
          # uncommitted vector file is caught as well as a modified one.
          if [ -n "$(git status --porcelain testdata/vectors/)" ]; then
            git status --porcelain testdata/vectors/
            echo "::error::Committed vectors do not match freshly generated output."
            echo "::error::If this is intentional it is a wire format change and needs a new spec version."
            exit 1
          fi

      # Unconditional. This half of the check was behind a guard while the web
      # client did not exist; a guard that can silently skip the only test
      # proving two implementations agree is worth less than no guard at all.
      - name: Verify TypeScript implementation against shared vectors
        working-directory: web
        run: |
          npm ci
          npm run test:vectors

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build web client, then the binary with assets embedded
        run: |
          set -euo pipefail
          (cd web && npm ci && npm run build)

          # Untagged first: this is what a contributor gets, and it must compile
          # without a JavaScript toolchain having run.
          go build ./...

          # Then tagged, which is what a release ships. The embed pattern has no
          # fallback file, so this fails rather than quietly producing a binary
          # with no client in it.
          go build -tags embedui -o /tmp/sendan-ui ./cmd/sendan

      # The statement of what the published client hashes to, which is what
      # makes it possible to check that an instance serves it rather than a
      # modified one (docs/design.md §7.1). Generated here because it describes
      # the build, and checked here because a manifest that missed an asset
      # would leave that asset replaceable without detection.
      - name: State what the client hashes to
        run: ./scripts/asset-manifest.sh

      - name: Keep the manifest with the run that produced it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-manifest
          path: internal/webui/manifest.json
          retention-days: 14

      # Tests that need the client present cannot run in the job above, which
      # deliberately has no JavaScript toolchain. They run here, where it has
      # just been built - otherwise they skip everywhere and prove nothing.
      - name: Test what only a build with the client can test
        run: go test -tags embedui ./internal/httpapi/ ./internal/webui/

      # A binary that compiled but embedded nothing would start, serve the API,
      # and answer every page with an explanation nobody reads until a user
      # complains.
      - name: Assert the client is actually inside the binary
        run: |
          set -euo pipefail
          if ! grep -qa "sveltekit" /tmp/sendan-ui; then
            echo "::error::the binary does not contain the web client"
            exit 1
          fi
          echo "Client embedded."
