# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The primary merge gate. See docs/workflows/test.md
#
# Every job carries timeout-minutes. The whole workflow takes four to five
# minutes, so twenty never cancels honest work - it is there because the
# default is six hours, and the way a fixture fails is not always by failing.
# An object store that accepts connections and never completes an upload holds
# a runner for an afternoon and reports nothing anyone can read.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "22"

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The linter's version is pinned as well as the action's. Without it the
      # action installs the newest release, which is built against a newer Go
      # than GO_VERSION above - and its formatter then demands a layout that
      # the pinned toolchain's gofmt undoes. The two halves of this job
      # disagreed and a file nobody had touched since March started failing.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test-go:
    name: Unit and integration tests (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The store conformance suite runs against every backend, so PostgreSQL has
    # to be real. Without this the PostgreSQL cases would skip, and a backend
    # whose tests never run is a backend nobody is testing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: sendan
          POSTGRES_DB: sendan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SENDAN_TEST_POSTGRES: postgres://postgres:sendan@127.0.0.1:5432/sendan?sslmode=disable
      SENDAN_TEST_S3: s3://sendan:sendansecret@127.0.0.1:8333/sendan?ssl=false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # MinIO is started here rather than as a service container: services
      # cannot pass a command, and the image needs "server /data".
      # MinIO archived its community server and client. dl.min.io now answers
      # 410 with a notice instead of a binary, and `curl -sSL` wrote that page
      # to the file, chmod made it executable, and the shell tried to run it:
      #
      #   /home/runner/work/_temp/mc: line 3: syntax error near unexpected token `('
      #
      # Every pull request failed on it, including ones that touched no Go code.
      # So there is no client here any more: MinIO serves each top-level
      # directory under its data path as a bucket, which this creates before the
      # server starts - no download, and no race against it coming up.
      #
      # Pinned by digest for the reason the Dockerfile pins its bases and these
      # The object store the S3 backend is tested against.
      #
      # Deliberately not the one this ran before, and the reason is the point.
      # That fixture broke twice without a commit touching it: first its
      # vendor's command-line client began answering with a notice page, which
      # a `curl` without --fail wrote onto PATH for the next line to execute,
      # and then the server image itself stopped being anonymously pullable -
      # Docker Hub and quay both answer 401 for it now, by tag and by digest.
      # Each time a dependency bump was reported as breaking this project when
      # nothing of this project had changed.
      #
      # This one is pinned by digest, verified pullable anonymously, and
      # prepared by code in this repository rather than by a downloaded tool.
      # The whole conformance suite, multipart included, passes against it.
      #
      # Signed requests need an identity to verify against, so the credentials
      # the tests already use are written out for the server. Without them
      # every S3 case fails on the signature instead of on what it tests.
      - name: Start the object store
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s3"
          cat > "$RUNNER_TEMP/s3/config.json" <<'JSON'
          {
            "identities": [
              {
                "name": "sendan",
                "credentials": [{ "accessKey": "sendan", "secretKey": "sendansecret" }],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          JSON
          docker run -d --name s3 -p 8333:8333 \
            -v "$RUNNER_TEMP/s3:/conf" \
            docker.io/chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -s3 -s3.config=/conf/config.json -dir=/data

      # Creates the bucket and waits for the store to be able to serve it, both
      # over the S3 library the application itself uses, and both reading the
      # same variable the tests read. It replaces a health-check loop and a
      # downloaded client; see the note at the top of tools/s3-bucket.
      #
      # It says so when the store never arrives, which the old loop did only
      # after giving up silently and leaving the tests to fail with something
      # less obvious.
      - name: Prepare the bucket
        run: go run ./tools/s3-bucket

      - name: go vet
        run: go vet ./...
      - name: go test (race detector, coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # A floor per package, ratcheted just below what is achieved, so a change
      # that reduces coverage fails rather than being noticed later. It also
      # rejects a package with no floor and a floor for a package that is gone,
      # which is what stops the file drifting into decoration.
      - name: Enforce coverage floors
        run: ./scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 7

  test-web:
    name: Unit tests (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Named for what it does rather than for its first line: this is the lint,
      # the type-check, the tests and the production build, and an unnamed step
      # reports all four as "Run npm ci" in the log somebody reads to find out
      # whether the type-check runs at all.
      - name: Lint, type-check, test and build the client
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run check
          npm run test:coverage
          npm run build

      # Two failures the policy causes at run time and nothing else reports. A
      # single external origin breaks the strict CSP and silently reintroduces a
      # third party into an end-to-end encrypted page. An inline style is
      # refused outright, and a refused style is not a broken page - it renders
      # correctly in development, which sends no policy, and wrongly everywhere
      # that matters. The policy is the enforcement; this says so at build time
      # rather than in a browser console.
      #
      # It checks for references that cause a load, not for the text of a URL:
      # an earlier version grepped every script for https:// and failed on the
      # documentation links inside Svelte's own error messages.
      - name: Assert the client runs under its own Content-Security-Policy
        run: ./scripts/audit-assets.sh

      # A licence obligation rather than a style rule: MIT asks that the notice
      # travel with "all copies or substantial portions", and the bundle is the
      # distribution, so a link to the source does not discharge it.
      #
      # This ran only in scripts/verify.sh until now, which meant it held only
      # for whoever remembered to run it. #223 bumped Kit and Svelte and the
      # notices kept naming the versions before it, merged green.
      - name: Assert the third-party notices name what is shipped
        run: ./scripts/check-notices.sh

  test-vectors:
    name: Cross-language crypto vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This is the check that stops the CLI and the browser disagreeing about
      # what a file means. It must never be made non-blocking.
      - name: Verify Go implementation against shared vectors
        run: go test ./internal/crypto/... -run TestVectors -v

      # The vectors must match what was committed. A change to the encoder that
      # also regenerates its own fixture would otherwise pass silently, which
      # would defeat the entire point of a cross-language fixture.
      - name: Assert committed vectors are reproducible
        run: |
          set -euo pipefail
          node testdata/vectors/generate-json-encoding.mjs
          go test ./internal/crypto/ -run TestVectors -update-vectors
          # git status rather than git diff, so a newly generated but
          # uncommitted vector file is caught as well as a modified one.
          if [ -n "$(git status --porcelain testdata/vectors/)" ]; then
            git status --porcelain testdata/vectors/
            echo "::error::Committed vectors do not match freshly generated output."
            echo "::error::If this is intentional it is a wire format change and needs a new spec version."
            exit 1
          fi

      # Unconditional. This half of the check was behind a guard while the web
      # client did not exist; a guard that can silently skip the only test
      # proving two implementations agree is worth less than no guard at all.
      - name: Verify TypeScript implementation against shared vectors
        working-directory: web
        run: |
          npm ci
          npm run test:vectors

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Before anything is built, because what this asserts is that the two
      # halves built here come from the same toolchains as the image. It ran
      # only in scripts/verify.sh until now - so it held for whoever remembered
      # to run it, and a dependency bump that moved the Dockerfile alone reached
      # a release. v0.2.0 shipped an image that failed its own published
      # manifest. See #260.
      - name: Assert one toolchain builds the manifest and the image
        run: ./scripts/check-toolchains.sh

      - name: Build web client, then the binary with assets embedded
        run: |
          set -euo pipefail
          (cd web && npm ci && SENDAN_COMMIT="$GITHUB_SHA" npm run build)

          # Untagged first: this is what a contributor gets, and it must compile
          # without a JavaScript toolchain having run.
          go build ./...

          # Then tagged, which is what a release ships. The embed pattern has no
          # fallback file, so this fails rather than quietly producing a binary
          # with no client in it.
          go build -tags embedui -o /tmp/sendan-ui ./cmd/sendan

      # The statement of what the published client hashes to, which is what
      # makes it possible to check that an instance serves it rather than a
      # modified one (docs/design.md §7.1). Generated here because it describes
      # the build, and checked here because a manifest that missed an asset
      # would leave that asset replaceable without detection.
      - name: State what the client hashes to
        run: ./scripts/asset-manifest.sh

      - name: Keep the manifest with the run that produced it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-manifest
          path: internal/webui/manifest.json
          retention-days: 14

      # Tests that need the client present cannot run in the job above, which
      # deliberately has no JavaScript toolchain. They run here, where it has
      # just been built - otherwise they skip everywhere and prove nothing.
      - name: Test what only a build with the client can test
        run: go test -tags embedui ./internal/httpapi/ ./internal/webui/

      # A binary that compiled but embedded nothing would start, serve the API,
      # and answer every page with an explanation nobody reads until a user
      # complains.
      - name: Assert the client is actually inside the binary
        run: |
          set -euo pipefail
          if ! grep -qa "sveltekit" /tmp/sendan-ui; then
            echo "::error::the binary does not contain the web client"
            exit 1
          fi
          echo "Client embedded."

  # The image is only built by the release workflow, which runs on a tag - so a
  # change that breaks it would be found at the moment of publishing, by the one
  # job with nothing after it to catch anything. Built here on both
  # architectures, and then actually started: an image that builds and exits is
  # a passing build and a broken release.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built with the attestations the release publishes, and exported rather
      # than pushed, so what they are checked on is an image nobody had to
      # publish first.
      - name: Build for both architectures, with attestations
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=oci,dest=/tmp/sendan-oci.tar
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

      # A flag that stops taking effect looks exactly like one that works: the
      # build succeeds, the image is pushed, and the absence is found by the
      # operator who tries to verify it - if anybody ever does.
      - name: Assert the attestations are actually there
        run: ./scripts/audit-attestations.sh /tmp/sendan-oci.tar

      # Loaded singly because a multi-architecture build produces a manifest
      # list, and there is nothing to run in one of those.
      - name: Build for this machine and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sendan:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

      # Under the conditions the documentation asks operators to use, because a
      # read-only root filesystem is exactly the kind of constraint that is
      # discovered to be unsatisfiable in production. No tmpfs: neither backend
      # needs scratch space, and a container that quietly started depending on
      # one again would pass a laxer check.
      - name: Start it read-only and non-root, and use it
        run: |
          set -euo pipefail
          docker run -d --name sendan-ci \
            --read-only \
            -v sendan-ci-data:/var/lib/sendan \
            -p 8080:8080 \
            -e SENDAN_BASE_URL=http://127.0.0.1:8080 \
            sendan:ci

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/api/source >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "It reports:"
          curl -fsS http://127.0.0.1:8080/api/source

          # An image that cannot say which release it is cannot be checked
          # against one, and the build argument that stamps it is easy to drop.
          if ! curl -fsS http://127.0.0.1:8080/api/source | grep -q '"version": *"ci"'; then
            echo "::error::the image does not report the version it was built with"
            docker logs sendan-ci
            exit 1
          fi

          # The client has to be in there too: serve_ui defaults on, so an image
          # built without the embedui tag would answer this with an explanation
          # rather than the application.
          if ! curl -fsS http://127.0.0.1:8080/ | grep -qi "sendan"; then
            echo "::error::the image does not serve the web client"
            exit 1
          fi

          docker rm -f sendan-ci >/dev/null
