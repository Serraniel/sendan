# SPDX-License-Identifier: AGPL-3.0-or-later
#
# See docs/workflows/dependabot.md
version: 2

updates:
  # Keeps the SHA pins in .github/workflows current. Without this, pinning
  # would mean never receiving upstream fixes to the actions themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: ["area:infra", "type:chore"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["area:server", "type:chore"]
    groups:
      # Routine dependencies may be grouped; cryptographic ones may not.
      # A grouped bump hides an individual change inside a larger diff, and
      # every cryptographic dependency must be reviewed on its own.
      go-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "golang.org/x/crypto"
          - "filippo.io/*"
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["area:web", "type:chore"]
    groups:
      # Ordered first deliberately: a dependency joins the first group it
      # matches, and these have to move together whatever the update type.
      #
      # @vitest/coverage-v8 declares vitest as a peer, so a major bump of one
      # without the other cannot resolve - npm ci fails before a single test
      # runs, which is how #99 was found.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major", "minor", "patch"]

      # Same reason, and this is how #316 and #317 were found. The peer edges
      # run in a ring: @sveltejs/adapter-static requires @sveltejs/kit, kit
      # requires svelte, vite and @sveltejs/vite-plugin-svelte, the plugin
      # requires vite and svelte, and svelte-check requires svelte. Dependabot
      # split the kit 3 bump from the adapter-static 4 bump, and each half
      # failed npm ci on the other's peer range before a test ran.
      #
      # vite is here because kit declares it as a peer with a major range, so a
      # vite major on its own fails the same way.
      sveltekit:
        patterns: ["@sveltejs/*", "svelte", "svelte-check", "vite"]
        update-types: ["major", "minor", "patch"]

      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          # Cryptographic, so it is reviewed on its own rather than inside a
          # larger diff.
          - "hash-wasm"
        update-types: ["minor", "patch"]

    ignore:
      # svelte-check refuses TypeScript 7 unless TypeScript 6 is installed
      # alongside it under an npm alias and it is run behind an experimental
      # flag. Type checking is a gate here, so it does not get to depend on an
      # experimental path. Drop this once svelte-check accepts ^7 on its own -
      # its peer range currently reads ^5.0.0 || ^6.0.0. See #93.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["area:infra", "type:chore"]

    ignore:
      # The Node major decides the bundler's output, and the release builds the
      # client twice - on a runner for the signed asset manifest, and in the
      # Dockerfile for the image. Two majors emit two sets of content-hashed
      # filenames, which shipped in v0.2.0 and made `sendan verify` call the
      # project's own image compromised. See #260.
      #
      # So the line has to be LTS on the day it is adopted, and Dependabot
      # cannot tell: it proposed Current in #165 and #278, and in #323 it
      # proposed 25, which reached end of life in June 2026. Digest updates are
      # not ignored, so security patches for the pinned line still arrive; only
      # the major is a deliberate choice. CONTRIBUTING.md has the rule.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
