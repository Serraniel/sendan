# SPDX-License-Identifier: AGPL-3.0-or-later
version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert

  settings:
    gosec:
      excludes:
        # Sendan is a cryptography project; the "uses crypto primitive"
        # heuristics fire on nearly every line here and drown real findings.
        - G407 # hardcoded IV/nonce - nonces are spec-defined and covered by tests

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
